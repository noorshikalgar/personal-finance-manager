version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: financeuser
      POSTGRES_PASSWORD: financepass
      POSTGRES_DB: financedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeuser -d financedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-tracker-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://financeuser:financepass@postgres:5432/financedb
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: Alj6D4o/a5F2g3Zr7rZ0hJLgEeGtjnZLvT62MF9F+lg=
      CRON_SECRET: ${CRON_SECRET:-your-secret-key-here}
      NODE_ENV: production
    ports:
      - "3099:3000"
    volumes:
      # For development, mount source code
      # Comment out in production
      - .:/app
      - /app/node_modules
      - /app/.next

  cron:
    build:
      context: ./cron
      dockerfile: Dockerfile
    container_name: finance-tracker-cron
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET}
      TZ: Asia/Kolkata
    volumes:
      - cron_logs:/var/log

volumes:
  postgres_data:
    driver: local
  cron_logs:
    driver: local
